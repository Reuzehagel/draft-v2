[package]
name = "draft"
version = "0.1.0"
edition = "2021"
description = "Push-to-talk speech-to-text for Windows"
license = "MIT"

[[bin]]
name = "draft"
path = "src/main.rs"

# PROTOTYPE — throwaway, delete along with prototypes/ once wayfinder #33 lands.
[[bin]]
name = "pill-loop-proto"
path = "prototypes/pill_loop_proto.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
directories = "5"
tray-icon = "0.19"
image = { version = "0.25", default-features = false, features = ["png"] }
crossbeam-channel = "0.5"
winit = "0.30"
global-hotkey = "0.6"
cpal = "0.15"
rubato = "0.16"
hound = "3"
parking_lot = "0.12"
tiny-skia = "0.11"
realfft = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json", "rustls-tls"] }
serde_json = "1"
arboard = "3"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
keyring = { version = "3", features = ["windows-native"] }
transcribe-rs = { version = "0.3", default-features = false, features = ["onnx"] }
svgtypes = "0.16.1"
fontdue = "0.9.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1
